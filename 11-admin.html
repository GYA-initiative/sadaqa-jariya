<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>لوحة التحكم | نور الهداية</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="wrap wide">
  <div class="top"><a href="index.html">→ الموقع</a><button id="out" class="ghost" type="button" hidden style="margin:0">خروج</button></div>
  <h1>لوحة التحكم</h1>

  <div id="login" class="card" style="max-width:420px">
    <form id="form">
      <label for="email">بريد الأدمن</label><input id="email" type="email" required autocomplete="email" dir="ltr">
      <label for="pw">كلمة المرور</label><input id="pw" type="password" required autocomplete="current-password" dir="ltr">
      <button type="submit">دخول</button>
      <div id="lmsg" class="msg err" role="status"></div>
    </form>
  </div>

  <div id="dash" hidden>
    <div class="stats">
      <div class="stat"><b id="sTotal">-</b><span>إجمالي الحسابات</span></div>
      <div class="stat"><b id="sNew">-</b><span>جديد آخر ٧ أيام</span></div>
      <div class="stat"><b id="sConf">-</b><span>بريد مؤكَّد</span></div>
      <div class="stat"><b id="sAct">-</b><span>نشط آخر ٧ أيام</span></div>
    </div>
    <div class="card">
      <input id="q" placeholder="بحث بالاسم أو البريد" maxlength="80">
      <div class="scroll" style="margin-top:12px">
        <table><thead><tr><th>الاسم</th><th>البريد</th><th>تاريخ التسجيل</th><th>التأكيد</th><th>آخر دخول</th></tr></thead><tbody id="rows"></tbody></table>
      </div>
      <button id="copy" class="ghost" type="button">نسخ ملخص التسجيلات الجديدة</button>
      <div id="dmsg" class="msg" role="status"></div>
      <div class="note">لا تظهر كلمات المرور أو رموز التحقق هنا، ولا تُخزَّن إلا مجزّأة داخل Supabase.</div>
    </div>
  </div>
</div>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
